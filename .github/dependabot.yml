# Dependabot will run on day 21 of each month at 01:21 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "21 1 21 * *"
    open-pull-requests-limit: 20
    assignees:
      - "TA2k"
    versioning-strategy: "increase"
